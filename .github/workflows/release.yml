name: Release

# Push a tag like `v0.1.0` to build installers for every platform and attach
# them to a draft GitHub Release. Review the draft, then click "Publish".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check versions match the tag
        run: |
          version="${TAG#v}"
          for file in package.json src-tauri/tauri.conf.json; do
            found=$(node -p "require('./$file').version")
            [ "$found" = "$version" ] || { echo "::error file=$file::version $found does not match tag $TAG"; exit 1; }
          done
          grep -q "^version = \"$version\"" src-tauri/Cargo.toml \
            || { echo "::error file=src-tauri/Cargo.toml::version does not match tag $TAG"; exit 1; }
      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Take the id from the create response; a freshly created draft can lag in the list endpoint.
          id=$(gh api --paginate "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG" -f name="Git Context ${TAG}" -F draft=true \
              -F body=@.github/RELEASE_NOTES.md --jq .id)
          fi
          # tauri-action silently skips uploads without a release id.
          [ -n "$id" ] || { echo "::error::Could not resolve release id for $TAG"; exit 1; }
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: create-release
    strategy:
      fail-fast: false
      max-parallel: ${{ vars.TAURI_UPDATER_PUBLIC_KEY != '' && 1 || 6 }}
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - name: Windows (ARM64)
            os: windows-latest
            target: aarch64-pc-windows-msvc
            # WiX (MSI) cannot target ARM64; ship the NSIS installer only.
            args: --target aarch64-pc-windows-msvc --bundles nsis
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
          - name: Linux (ARM64)
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Configure signed updates
        run: node scripts/configure-updater.mjs
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_SIGNING_PRIVATE_KEY is the normalized temporary file set above.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # AppImage bundling needs this on newer runners.
          NO_STRIP: ${{ runner.os == 'Linux' && 'true' || '' }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}${{ vars.TAURI_UPDATER_PUBLIC_KEY != '' && ' --config src-tauri/tauri.updater.conf.json' || '' }}
          uploadUpdaterJson: ${{ vars.TAURI_UPDATER_PUBLIC_KEY != '' }}
          updaterJsonPreferNsis: true
